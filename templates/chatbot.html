<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot PPDB SMKN 1 KOTA SORONG</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sekolah: {
                            blue: '#3C59A5',
                            orange: '#ff6900',
                            dark: '#32373c'
                        }
                    },
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="min-h-[100dvh] bg-slate-50 font-inter overflow-hidden relative">

    <!-- Ambient Background Blobs -->
    <div class="blob-shape blob-1 pointer-events-none opacity-50"></div>
    <div class="blob-shape blob-2 pointer-events-none opacity-50" style="bottom: 0; right: -100px;"></div>

    <main class="h-[100dvh] w-full relative z-10 flex">
        
        <!-- SIDEBAR (Riwayat Percakapan) -->
        <aside id="sidebar" class="w-80 bg-white/95 border-r border-slate-200/50 flex flex-col h-full flex-shrink-0 z-40 absolute md:relative transition-all duration-300 transform -translate-x-full md:translate-x-0 md:ml-0 shadow-[10px_0_30px_rgba(0,0,0,0.02)]">
            <!-- Top Section: Back and New Chat -->
            <div class="p-6 border-b border-slate-100 space-y-4 relative">
                <div class="flex items-center justify-between">
                    <a href="/" class="flex items-center gap-2 text-slate-500 hover:text-sekolah-blue font-semibold transition-all py-1 rounded-xl text-sm hover:bg-blue-50/50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                        Kembali
                    </a>
                    
                    <button id="close-sidebar-btn" class="p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-600 rounded-lg transition-all" title="Tutup Sidebar">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
                    </button>
                </div>
                
                <button id="clear-btn" class="w-full flex items-center justify-center gap-2 text-white bg-sekolah-blue hover:bg-blue-700 font-bold transition-all px-4 py-3 rounded-xl text-sm shadow-md hover:shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    Percakapan Baru
                </button>
            </div>
            
            <!-- History List -->
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
                <!-- Dynamic chat history will be appended here -->
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <div class="flex-1 flex flex-col items-center justify-center relative h-full w-full">
            
            <!-- Toggle Sidebar Button (Outside) -->
            <div class="absolute top-4 left-4 z-50">
                <button id="open-sidebar-btn" class="p-2 text-slate-500 bg-white/50 hover:bg-white hover:text-sekolah-blue rounded-xl border border-slate-200/50 hover:shadow-sm transition-all focus:outline-none md:hidden" title="Buka Sidebar">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
            </div>
            
            <div id="chat-welcome" class="w-full px-8 md:px-16 text-center animate-reveal flex flex-col items-center z-10 transition-all duration-500">
                <div class="w-24 h-24 mb-6 bg-white rounded-full flex items-center justify-center shadow-xl p-2 border-4 border-white relative">
                    <div class="absolute inset-0 rounded-full border border-sekolah-blue/20 animate-ping"></div>
                    <img src="/static/images/logo.webp" alt="Logo SMKN 1 Sorong" class="w-full h-full object-contain relative z-10">
                </div>
                <h2 class="font-outfit text-3xl md:text-5xl font-black text-sekolah-dark mb-4 tracking-tight">Halo, Calon Siswa!</h2>
                <p class="text-lg md:text-xl font-medium text-slate-500 mb-10 max-w-lg">Saya adalah Asisten AI Resmi PPDB SMKN 1 Sorong. Apa yang bisa saya bantu hari ini?</p>
            </div>

            <!-- Messages area (Hidden initially) -->
            <div id="chat-container" class="w-full max-w-4xl px-4 md:px-8 flex-1 flex-col hidden z-10 transition-all duration-500 h-full max-h-[85vh] pt-4 pb-2 relative">
                
                <!-- Sticky Header for Active Chat -->
                <div class="flex items-center gap-4 pb-4 mb-4 border-b border-slate-200/50 flex-shrink-0 sticky top-0 bg-slate-50/95 z-20 rounded-b-2xl px-4 pt-2">
                    <div class="w-12 h-12 ml-12 md:ml-0 bg-white rounded-full flex items-center justify-center shadow-sm p-1.5 border border-slate-100 shrink-0">
                        <img src="/static/images/logo.webp" alt="Logo Bot" class="w-full h-full object-contain">
                    </div>
                    <div>
                        <h3 class="font-outfit font-bold text-sekolah-dark text-lg">Asisten AI PPDB</h3>
                        <div class="flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                            <span class="text-xs text-slate-500 font-medium">Siap Membantu</span>
                        </div>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto space-y-6 pr-2 custom-scrollbar px-4" id="chat-area">
                </div>
            </div>

            <!-- Input area -->
            <div id="chat-input-wrapper" class="w-full max-w-4xl px-4 md:px-8 z-20 pb-4 md:pb-8 mt-auto relative">
                <div class="relative bg-white/95 border border-white rounded-3xl shadow-[0_15px_40px_rgba(0,0,0,0.08)] p-2.5 flex items-center focus-within:shadow-[0_15px_50px_rgba(60,89,165,0.15)] focus-within:border-sekolah-blue/30 transition-all">
                    <input type="text" id="user-input" class="w-full bg-transparent border-none px-5 py-3 focus:outline-none focus:ring-0 text-slate-700 placeholder:text-slate-400 text-base font-medium" placeholder="Tanyakan seputar pendaftaran, jurusan, dll...">
                    
                    <div class="flex items-center gap-2 pr-1">
                        <button id="voice-btn" class="w-11 h-11 text-slate-500 hover:bg-slate-100 hover:text-sekolah-blue rounded-full flex items-center justify-center transition-all flex-shrink-0" title="Gunakan Suara">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
                        </button>
                        <button id="send-btn" class="w-11 h-11 bg-gradient-to-br from-sekolah-blue to-[#2a417a] rounded-full flex items-center justify-center text-white hover:shadow-lg transition-all flex-shrink-0 hover:scale-105 active:scale-95">
                            <svg id="send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 translate-x-[2px]"><path d="M3.478 2.404a.75.75 0 00-.926.941l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.404z" /></svg>
                            <svg id="stop-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 hidden"><path fill-rule="evenodd" d="M5.25 7.5A2.25 2.25 0 017.5 5.25h9a2.25 2.25 0 012.25 2.25v9a2.25 2.25 0 01-2.25 2.25h-9a2.25 2.25 0 01-2.25-2.25v-9z" clip-rule="evenodd" /></svg>
                        </button>
                    </div>
                </div>

                <!-- Suggested Prompts -->
                <div id="suggested-prompts" class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4 animate-reveal delay-200">
                    <div class="auto-ask cursor-pointer glass-card hover:bg-white p-5 rounded-2xl transition-all text-left flex flex-col gap-3 group" data-question="Apa saja syarat pendaftaran PPDB tahun ini?">
                        <div class="text-sekolah-blue bg-blue-50 w-10 h-10 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                        </div>
                        <div>
                            <h4 class="font-outfit text-sm font-bold text-slate-800">Syarat Pendaftaran</h4>
                            <p class="text-xs text-slate-500 mt-1">Berkas & dokumen yang wajib</p>
                        </div>
                    </div>
                    
                    <div class="auto-ask cursor-pointer glass-card hover:bg-white p-5 rounded-2xl transition-all text-left flex flex-col gap-3 group" data-question="Ada jurusan apa saja yang tersedia di SMKN 1 Sorong?">
                        <div class="text-sekolah-orange bg-orange-50 w-10 h-10 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                        </div>
                        <div>
                            <h4 class="font-outfit text-sm font-bold text-slate-800">Jurusan Tersedia</h4>
                            <p class="text-xs text-slate-500 mt-1">Pilihan program studi</p>
                        </div>
                    </div>

                    <div class="auto-ask cursor-pointer glass-card hover:bg-white p-5 rounded-2xl transition-all text-left flex flex-col gap-3 group" data-question="Kapan jadwal pendaftaran dan seleksi PPDB?">
                        <div class="text-green-600 bg-green-50 w-10 h-10 rounded-xl flex items-center justify-center group-hover:scale-110 transition-transform shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        </div>
                        <div>
                            <h4 class="font-outfit text-sm font-bold text-slate-800">Jadwal Seleksi</h4>
                            <p class="text-xs text-slate-500 mt-1">Tanggal penting PPDB</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
